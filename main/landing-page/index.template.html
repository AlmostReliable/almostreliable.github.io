        <title>Almost Reliable Documentation</title>
        <meta name="description" content="Documentation hub for Almost Reliable projects." />
        <script>
            ;(() => {
                let preference = "auto"
                try {
                    preference = localStorage.getItem("vitepress-theme-appearance") || "auto"
                } catch {}
                const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches
                const dark = preference === "auto" ? systemDark : preference === "dark"
                document.documentElement.classList.toggle("dark", dark)
            })()
        </script>

        <main class="layout">
            <section class="hero">
                <h1 class="hero__heading">
                    <span class="hero__name">Almost Reliable</span>
                    <span class="hero__text">Documentation</span>
                </h1>
            </section>
            <section class="wikis" aria-label="Wikis">
                <div class="wikis__grid">{{WIKI_CARDS}}</div>
            </section>
        </main>
        <script>
            document.querySelector(".appearance-switch").addEventListener("click", () => {
                const root = document.documentElement
                const dark = root.classList.toggle("dark")
                const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches
                try {
                    localStorage.setItem(
                        "vitepress-theme-appearance",
                        dark === systemDark ? "auto" : dark ? "dark" : "light"
                    )
                } catch {}
            })
        </script>
